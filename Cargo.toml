[package]
name = "astral-futures-tar"
version = "0.6.3"
authors = [
    "Alex Crichton <alex@alexcrichton.com>",
    "dignifiedquire <me@dignifiequire.com>",
    "Artem Vorotnikov <artem@vorotnikov.me>",
    "Aiden McClelland <me@drbonez.dev>",
]
homepage = "https://github.com/astral-sh/tokio-tar"
repository = "https://github.com/astral-sh/tokio-tar"
documentation = "https://docs.rs/astral-futures-tar"
license = "MIT OR Apache-2.0"
keywords = ["tar", "tarfile", "encoding"]
readme = "README.md"
edition = "2021"
rust-version = "1.83.0"

description = """
A Rust implementation of an async TAR file reader and writer. This library does not
currently handle compression, but it is abstract over all I/O readers and
writers. Additionally, great lengths are taken to ensure that the entire
contents are never required to be entirely resident in memory all at once.
"""

[dependencies]
async-fs = { version = "2.2.0", optional = true }
async-lock = { version = "3.4.1", optional = true }
futures-core = "0.3"
futures-lite = { version = "2.6.1", optional = true }
portable-atomic = "1"
rustc-hash = "2.1.0"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"], optional = true }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
futures-lite = "2.6.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
rustix = { version = "1.0", features = ["fs"] }
xattr = { version = "1.0", optional = true }

[features]
default = ["tokio", "xattr"]
futures = ["dep:async-fs", "dep:async-lock", "dep:futures-lite"]
tokio = ["dep:tokio", "dep:tokio-stream"]

[lib]
name = "astral_futures_tar"

[[example]]
name = "extract_file"
required-features = ["tokio"]

[[example]]
name = "list"
required-features = ["tokio"]

[[example]]
name = "raw_list"
required-features = ["tokio"]

[[example]]
name = "write"
required-features = ["tokio"]

[[example]]
name = "futures_list"
required-features = ["futures"]
